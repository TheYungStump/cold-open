[package]
name = "coldopen-core"
description = "Cold Open document model, command dispatcher, undo/redo, crash journal and atomic saves."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# JSON Schema for every command's params (MCP tool schemas).
schema = ["dep:schemars", "coldopen-screenplay/schema"]

[dependencies]
coldopen-screenplay.workspace = true
coldopen-fountain.workspace = true
coldopen-layout.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
schemars = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
