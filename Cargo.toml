[workspace]
resolver = "3"
members = [
    "crates/screenplay",
    "crates/fountain",
    "crates/fonts",
    "crates/layout",
    "crates/fdx",
    "crates/core",
    "crates/cli",
    "crates/app",
    "crates/link",
    "crates/mcp",
    "crates/diff",
]
exclude = ["fuzz", "tools/refpdf"]

[workspace.package]
# One version for every program, file and report (docs/specs/release.md §9).
# The dependency requirements below follow it.
version = "0.1.0-alpha.1"
edition = "2024"
# File::lock (used for journal locking) was stabilized in 1.89.
rust-version = "1.89"
repository = "https://github.com/TheYungStump/cold-open"
authors = ["The Cold Open contributors"]

[workspace.dependencies]
coldopen-screenplay = { path = "crates/screenplay", version = "0.1.0-alpha.1" }
coldopen-fountain = { path = "crates/fountain", version = "0.1.0-alpha.1" }
coldopen-fonts = { path = "crates/fonts", version = "0.1.0-alpha.1" }
coldopen-layout = { path = "crates/layout", version = "0.1.0-alpha.1" }
coldopen-core = { path = "crates/core", version = "0.1.0-alpha.1" }
coldopen-fdx = { path = "crates/fdx", version = "0.1.0-alpha.1" }
coldopen-link = { path = "crates/link", version = "0.1.0-alpha.1" }
coldopen-app = { path = "crates/app", version = "0.1.0-alpha.1" }
coldopen-mcp = { path = "crates/mcp", version = "0.1.0-alpha.1" }
coldopen-diff = { path = "crates/diff", version = "0.1.0-alpha.1" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
# Pinned exactly: each patch release moves to a newer Unicode version, which
# would move line breaks. Bump only with re-blessed layout goldens.
unicode-width = { version = "=0.2.2", default-features = false }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
pdf-writer = "0.15"
# Its default `variable-fonts` feature pulls in skrifa, write-fonts and kurbo,
# which a static TrueType font never needs.
subsetter = { version = "0.2.6", default-features = false }
miniz_oxide = "0.9"
# XML for .fdx (docs/spec.md, "Technology"); no default features.
quick-xml = "0.42"
# The .coldopen bundle's zip archive (docs/specs/bundle.md): MIT, pure Rust,
# no unsafe code and no dependencies of its own, with its own CRC-32.
# Deflate comes from miniz_oxide, already used for PDF.
rawzip = "0.5.2"

# The desktop app (docs/spec.md: iced, chosen in phase 1). Only the
# tiny-skia CPU renderer by default; the `gpu` feature of coldopen-app adds
# wgpu for comparison builds.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "x11", "wayland", "smol", "advanced", "linux-theme-detection", "sysinfo"] }
iced_test = "0.14"
# `sysinfo` (2026-10-30, phase 6a; 127 KB on Windows) tells the About sheet and
# the bench which renderer and GPU draw the window, and the CPU and OS they run
# on (docs/specs/bench.md §4).
# Already part of iced; named directly so the app can run itself headless
# (user interface, tasks) for tests and the gate driver.
iced_runtime = "0.14"
# The computer's name, written into each crash journal's header so a
# journal synced or committed from another computer is offered, never
# applied on its own (docs/specs/journal.md, "Header"). Apache-2.0; already
# in the tree through x11rb.
gethostname = "1.1"
# JSON Schema for command params, behind the core's `schema` feature, which
# only the MCP server turns on (tool input schemas).
schemars = "1"
# The agent link (docs/specs/mcp.md §5): local sockets and Windows named
# pipes, with the pipe's access list and the socket's peer check, without
# unsafe code of our own. Synchronous API only.
interprocess = "2.4"
# The link's token and pipe name, from the OS's random source.
getrandom = "0.3"
# Windows only: the pipe's access list as an SDDL string (interprocess
# already depends on it).
widestring = "1"
# The MCP server (docs/spec.md: rmcp). Server and stdio transport only.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros", "time", "io-std"] }
# Native open and save dialogs. Without default features it uses the XDG
# desktop portal on Linux (no GTK) and the system dialogs elsewhere.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# The bench's machine probe (docs/specs/bench.md §4): the OS, CPU and memory.
# Already in the tree through iced's `sysinfo` feature, at this version.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# Windows only, at build time: the app's icon and version details in its
# .exe (docs/specs/release.md §3.1). MIT; without default features it needs
# no TOML parser.
winresource = { version = "0.1.34", default-features = false }

# Dev-only.
proptest = "1.5"
tempfile = "3.10"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
