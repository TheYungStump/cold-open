[workspace]
resolver = "3"
members = [
    "crates/screenplay",
    "crates/fountain",
    "crates/fonts",
    "crates/layout",
    "crates/fdx",
    "crates/core",
    "crates/cli",
    "crates/app",
    "crates/link",
    "crates/mcp",
]
exclude = ["fuzz", "tools/refpdf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# File::lock (used for journal locking) was stabilized in 1.89.
rust-version = "1.89"
repository = "https://github.com/TheYungStump/cold-open"
authors = ["The Cold Open contributors"]

[workspace.dependencies]
coldopen-screenplay = { path = "crates/screenplay", version = "0.1.0" }
coldopen-fountain = { path = "crates/fountain", version = "0.1.0" }
coldopen-fonts = { path = "crates/fonts", version = "0.1.0" }
coldopen-layout = { path = "crates/layout", version = "0.1.0" }
coldopen-core = { path = "crates/core", version = "0.1.0" }
coldopen-fdx = { path = "crates/fdx", version = "0.1.0" }
coldopen-link = { path = "crates/link", version = "0.1.0" }
coldopen-app = { path = "crates/app", version = "0.1.0" }
coldopen-mcp = { path = "crates/mcp", version = "0.1.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
# Pinned exactly: each patch release moves to a newer Unicode version, which
# would move line breaks. Bump only with re-blessed layout goldens.
unicode-width = { version = "=0.2.2", default-features = false }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
pdf-writer = "0.15"
# Its default `variable-fonts` feature pulls in skrifa, write-fonts and kurbo,
# which a static TrueType font never needs.
subsetter = { version = "0.2.6", default-features = false }
miniz_oxide = "0.9"
# XML for .fdx (docs/spec.md, "Technology"); no default features.
quick-xml = "0.42"

# The desktop app (docs/spec.md: iced, chosen in phase 1). Only the
# tiny-skia CPU renderer by default; the `gpu` feature of coldopen-app adds
# wgpu for comparison builds.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "x11", "wayland", "smol", "advanced", "linux-theme-detection"] }
iced_test = "0.14"
# Already part of iced; named directly so the app can run itself headless
# (user interface, tasks) for tests and the gate driver.
iced_runtime = "0.14"
# JSON Schema for command params, behind the core's `schema` feature, which
# only the MCP server turns on (tool input schemas).
schemars = "1"
# The agent link (docs/specs/mcp.md §5): local sockets and Windows named
# pipes, with the pipe's access list and the socket's peer check, without
# unsafe code of our own. Synchronous API only.
interprocess = "2.4"
# The link's token and pipe name, from the OS's random source.
getrandom = "0.3"
# Windows only: the pipe's access list as an SDDL string (interprocess
# already depends on it).
widestring = "1"
# The MCP server (docs/spec.md: rmcp). Server and stdio transport only.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros", "time", "io-std"] }
# Native open and save dialogs. Without default features it uses the XDG
# desktop portal on Linux (no GTK) and the system dialogs elsewhere.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# Dev-only.
proptest = "1.5"
tempfile = "3.10"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
