name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  license-boundary:
    name: license boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: MIT/Apache crates must not depend on GPL crates
        run: |
          deps=$(cargo tree -p coldopen-screenplay -p coldopen-fountain -e normal,build --prefix none --format '{p}')
          echo "$deps"
          if echo "$deps" | grep -E '^coldopen-(core|cli|app|mcp) '; then
            echo "::error::A permissively licensed crate depends on a GPL crate."
            exit 1
          fi
