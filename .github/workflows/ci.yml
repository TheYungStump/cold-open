name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions minutes are limited (2026-10-15): pull requests and pushes to main
# run every OS; pushes to other branches run Linux only. A newer run on the
# same branch or pull request cancels the older one, except on main, where
# every commit keeps its result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Debug builds keep line tables only, so a panic's backtrace still has
  # files and lines. Full debug info in every test binary, each linking
  # iced and wgpu, filled the Linux runner's disk: a linker "Bus error" on
  # #22 and "No space left on device" on #23 (2026-11-03 and 11-04).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Every `run` step uses bash, which GitHub starts as `bash -eo pipefail` on
# all three OSes (Git Bash on Windows), so any failing command fails the step,
# including one on the left of a pipe. Left to the defaults, Linux and macOS
# would run `bash -e`, which ignores that failure, and Windows would run pwsh,
# which only checks the exit code of a step's last command.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Every OS on pull requests and main; Linux on other branches.
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The layout and PDF goldens are compared byte for byte here, so the
      # same files passing on all three OSes is the cross-platform check.
      # --no-fail-fast runs every test binary even after one fails, so one
      # failure never hides another; the step still fails at the end.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Layout goldens and timing in a release build
        run: cargo test --release --locked -p coldopen-layout -- --nocapture
      - name: Tests left the tree clean
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::tests created or changed files in the repository"
            exit 1
          fi
      - name: Keep golden mismatches
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}
          path: target/tmp/golden
          if-no-files-found: ignore

  msrv:
    name: minimum Rust (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      # The same goldens must pass on the oldest supported compiler, which
      # shows they do not depend on the Rust version.
      - name: Test
        run: cargo test --workspace --locked

  perf:
    name: repagination budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Full repagination of a 120-page script under 50 ms
        env:
          COLDOPEN_PERF: "1"
        run: cargo test --release --locked -p coldopen-layout --test perf -- --nocapture
      # docs/specs/diff.md §1 (decided 2026-10-22).
      - name: Two 120-page scripts diffed in memory under 100 ms
        env:
          COLDOPEN_PERF: "1"
        run: cargo test --release --locked -p coldopen-diff --test perf -- --nocapture
      - name: coldopen diff end to end under 500 ms
        env:
          COLDOPEN_PERF: "1"
        run: cargo test --release --locked -p coldopen-cli --test diff_budget -- --nocapture

  refpdf:
    name: PDF goldens read back
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/refpdf
      - name: Lint and test the extractor
        working-directory: tools/refpdf
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Every PDF golden matches its page view
        run: |
          cargo build --release --locked --manifest-path tools/refpdf/Cargo.toml
          for pdf in tests/fixtures/layout/*.pdf; do
            tools/refpdf/target/release/refpdf self-check "$pdf" "${pdf%.pdf}.pages.txt"
          done
      - name: Every PDF golden is structurally valid
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          for pdf in tests/fixtures/layout/*.pdf; do qpdf --check "$pdf"; done

  license-boundary:
    name: license boundary
    runs-on: ubuntu-latest
    env:
      # The permissively licensed crates (CLAUDE.md, "Workspace layout").
      PERMISSIVE_CRATES: coldopen-screenplay coldopen-fountain coldopen-fonts coldopen-layout coldopen-fdx coldopen-diff
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: MIT/Apache crates must not depend on GPL code
        run: |
          read -ra permissive <<<"$PERMISSIVE_CRATES"
          # Crates that declare only `license-file`, so cargo tree prints no
          # license for them, as `name@version`. Add one only after reading
          # its license file and finding it permissive. None so far.
          license_file_ok=()

          args=()
          for crate in "${permissive[@]}"; do args+=(-p "$crate"); done
          # `--target all` also follows dependencies gated on another OS.
          # cargo tree runs outside any pipe and its status is checked here,
          # so its failure fails the step even where `-e` does not apply.
          if ! tree=$(cargo tree --locked --target all "${args[@]}" -e normal,build --prefix none --format '{p}|{l}'); then
            echo "::error::cargo tree failed, so the dependency licenses were not checked."
            exit 1
          fi
          # Drop the blank lines between trees and the " (*)" cargo appends
          # to a crate it has already shown. Lines read "name vX.Y.Z ...|license".
          deps=$(sed -e '/^$/d' -e 's/ (\*)$//' <<<"$tree" | sort -u)
          echo "$deps"
          for crate in "${permissive[@]}"; do
            if ! grep -q "^$crate v" <<<"$deps"; then
              echo "::error::cargo tree did not list $crate."
              exit 1
            fi
          done

          if grep -E '^coldopen-(core|cli|app|mcp|link) ' <<<"$deps"; then
            echo "::error::A permissively licensed crate depends on a GPL crate."
            exit 1
          fi
          # Our own crates are checked too, so a new GPL crate of ours is
          # caught by its license even before it is named above.
          gpl=$(awk -F'|' 'NF && $2 ~ /GPL/' <<<"$deps")
          if [ -n "$gpl" ]; then
            echo "$gpl"
            echo "::error::A permissively licensed crate pulls in a GPL-family dependency."
            exit 1
          fi

          unlicensed=$(awk -F'|' 'NF && $2 == "" { split($1, p, " "); print p[1] "@" substr(p[2], 2) }' <<<"$deps")
          unvetted=()
          for crate in $unlicensed; do
            if [[ " ${license_file_ok[*]} " != *" $crate "* ]]; then unvetted+=("$crate"); fi
          done
          if [ ${#unvetted[@]} -gt 0 ]; then
            echo "::error::No SPDX license for ${unvetted[*]}. Read each license file; if it is permissive, add the crate to license_file_ok in this step."
            exit 1
          fi
      - name: MIT/Apache crates ship both license texts
        run: |
          read -ra permissive <<<"$PERMISSIVE_CRATES"
          for crate in "${permissive[@]}"; do
            # The files `cargo publish` would upload. The MIT license asks for
            # its notice in every copy.
            if ! files=$(cargo package --list --allow-dirty --locked -p "$crate"); then
              echo "::error::cargo package --list failed for $crate."
              exit 1
            fi
            for license in LICENSE-MIT LICENSE-APACHE; do
              if ! grep -qx "$license" <<<"$files"; then
                echo "::error::$crate would be published without $license."
                exit 1
              fi
              if ! cmp "crates/${crate#coldopen-}/$license" "$license"; then
                echo "::error::crates/${crate#coldopen-}/$license differs from the root $license."
                exit 1
              fi
            done
          done

  # The website (docs/specs/site.md §7), built and checked as pages.yml
  # publishes it: links between pages, personal details, and accessibility
  # in light and dark mode. Also that the GitHub templates read as YAML.
  site:
    name: website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: mdBook, pinned and checked
        run: bash tools/site_mdbook.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright, pinned
        run: |
          npm install --no-save --no-package-lock --silent playwright@1.48.2 @axe-core/playwright@4.10.1
          npx playwright install --with-deps chromium >/dev/null
      # The share image and the other brand images (release.md §12), from
      # tools/brand/. They're committed; this renders them again and keeps
      # them as an artifact, so a change to the brand shows here.
      - name: Brand images
        run: node tools/brand/render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: brand-images
          path: |
            docs/site/static/share.png
            docs/marketing/images/*.png
      # A fixture release with every build, so the download page's checks
      # don't depend on what the newest release holds (site.md §7). The
      # analytics beacon is off in this build (--token ""), so the checks
      # and the browser tests never reach Cloudflare; the switch's own
      # step builds it on.
      - name: Build
        run: |
          mdbook build docs/guide
          python tools/site_pages.py docs/guide/book --release tools/site_release_fixture.json --token ""
      - name: The pages the app opens are there
        run: |
          # crates/app/src/about.rs: SITE_URL and DOCS_URL.
          test -f docs/guide/book/index.html
          test -f docs/guide/book/guide/index.html
          test -f docs/guide/book/code-signing.html
          test -f docs/guide/book/privacy.html
      - name: Links between pages
        run: python tools/site_links.py docs/guide/book
      - name: Search tags, structured data, sitemap (site.md §10)
        run: python tools/site_seo.py docs/guide/book
      - name: No AI words on the writers' path (site.md §11)
        run: python tools/site_words.py docs/guide/book
      - name: No personal details
        run: python tools/privacy_scan.py --no-private --dir docs/guide/book
      - name: The analytics switch, both ways (site.md §8)
        run: |
          # Off (--token "" above): no page names Cloudflare.
          if grep -rl cloudflareinsights docs/guide/book; then
            echo "::error::the beacon is on a page while its switch is off"; exit 1
          fi
          # On, with a test token: every page carries it exactly once.
          mdbook build docs/guide -d book-beacon
          python tools/site_pages.py docs/guide/book-beacon --release tools/site_release_fixture.json --token test-token
          python - <<'EOF'
          import pathlib, sys
          bad = 0
          pages = sorted(pathlib.Path("docs/guide/book-beacon").rglob("*.html"))
          for f in pages:
              n = f.read_text(encoding="utf-8").count("static.cloudflareinsights.com/beacon.min.js")
              if n != 1 and f.name != "404.html":
                  print(f, n); bad += 1
          print(len(pages), "pages,", bad, "without exactly one beacon")
          sys.exit(1 if bad else 0)
          EOF
      - name: The issue and discussion templates read as YAML
        run: |
          pip install --quiet pyyaml==6.0.2
          python - <<'EOF'
          import glob, yaml
          for f in sorted(glob.glob(".github/ISSUE_TEMPLATE/*.yml") + glob.glob(".github/DISCUSSION_TEMPLATE/*.yml")):
              yaml.safe_load(open(f, encoding="utf-8"))
              print("ok", f)
          EOF
      - name: Accessibility, light and dark (axe-core, WCAG 2.2 AA)
        run: |
          # Served under /cold-open/, as GitHub Pages serves it: the 404
          # page's <base href> (book.toml's site-url) points there.
          mkdir -p _site
          cp -r docs/guide/book _site/cold-open
          python -m http.server 8000 --bind 127.0.0.1 --directory _site >/dev/null 2>&1 &
          for _ in $(seq 1 50); do curl -fs http://127.0.0.1:8000/cold-open/ >/dev/null && break; sleep 0.2; done
          node tools/site_a11y.mjs http://127.0.0.1:8000/cold-open/ docs/guide/book
      - name: The download page's recommendation and the started pages (site.md §5)
        run: node tools/site_browser.mjs http://127.0.0.1:8000/cold-open/

  # Crash reports and Report a problem, end to end on Linux
  # (docs/specs/crash-reports.md §10; docs/specs/editor.md §23). A build made
  # as a release is made crashes on purpose while typing: its report holds
  # nothing personal, and the symbols kept beside it name the function that
  # crashed. Then Report a problem opens its address through a stand-in
  # xdg-open, which writes it down instead of starting a browser.
  crash-report:
    name: crash report and Report a problem (Linux)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_STRIP: none
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The gate driver, built and stripped as a release is
        run: |
          cargo build --release --locked -p coldopen-app --bin coldopen-driver
          t=x86_64-unknown-linux-gnu
          mkdir -p "symbols/$t"
          objcopy --only-keep-debug target/release/coldopen-driver "symbols/$t/coldopen-driver.debug"
          strip --strip-all target/release/coldopen-driver
      - name: A crash while typing
        run: |
          home=$(mktemp -d)
          set +e
          printf 'char Z\nchar o\nchar r\nchar v\nchar a\nchar n\nchar t\nchar a\naction app.crash_test\nkey enter\n' \
            | target/release/coldopen-driver --home "$home"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then echo "::error::the driver didn't crash"; exit 1; fi
          report=$(ls "$home"/data/crash-reports/crash-*.txt)
          cat "$report"
          for private in Zorvanta "$home" "$HOME" "$USER" "$(hostname)"; do
            if grep -qiF -- "$private" "$report"; then
              echo "::error::the report holds $private"
              exit 1
            fi
          done
          grep -q '^Last action: app.crash_test$' "$report"
          python3 tools/symbolicate.py "$report" symbols | tee resolved.txt
          grep -q 'crash_on_purpose' resolved.txt
      - name: Report a problem opens a prefilled issue, and nothing else
        run: |
          home=$(mktemp -d)
          stub=$(mktemp -d)
          printf '#!/bin/sh\nprintf "%%s\\n" "$1" >>"%s/opened.txt"\n' "$stub" >"$stub/xdg-open"
          chmod +x "$stub/xdg-open"
          printf 'action app.report_problem\nchar g\nquit\n' \
            | PATH="$stub:$PATH" target/release/coldopen-driver --home "$home" --open-links
          cat "$stub/opened.txt"
          grep -q '^https://github.com/TheYungStump/cold-open/issues/new?template=bug.yml&version=' "$stub/opened.txt"
          for private in "$home" "$HOME" "$USER" "$(hostname)"; do
            if grep -qiF -- "$private" "$stub/opened.txt"; then
              echo "::error::the address holds $private"
              exit 1
            fi
          done

  # Nothing public names a person, and nothing shipped can reach the network
  # (docs/specs/site.md §8; the privacy statement in README.md).
  privacy:
    name: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Every commit, for the authors and messages.
          fetch-depth: 0
      - name: No personal details in the tree or the commits
        run: |
          python3 tools/privacy_scan.py --no-private
          python3 tools/privacy_scan.py --no-private --history
      - uses: dtolnay/rust-toolchain@stable
      - name: The programs hold no network client
        run: |
          # The crates that would let Cold Open open a connection. The agent
          # link is a local socket or pipe (std), and the MCP server is stdio.
          banned='reqwest ureq hyper h2 http curl curl-sys isahc attohttpc surf minreq native-tls openssl openssl-sys rustls tungstenite'
          if ! tree=$(cargo tree --locked --target all -p coldopen-app -p coldopen-cli -p coldopen-mcp -e normal --prefix none --format '{p}'); then
            echo "::error::cargo tree failed, so the dependencies were not checked."
            exit 1
          fi
          names=$(sed -e '/^$/d' -e 's/ .*//' <<<"$tree" | sort -u)
          found=()
          for crate in $banned; do
            if grep -qx "$crate" <<<"$names"; then found+=("$crate"); fi
          done
          if [ ${#found[@]} -gt 0 ]; then
            echo "::error::A network crate is in the programs' tree: ${found[*]}. The privacy statement says Cold Open makes no connections."
            exit 1
          fi
          echo "$(wc -l <<<"$names") crates, none of them a network client."

  # Every package for every target, sized, installed and started
  # (docs/specs/release.md, build.yml). Every OS on pull requests and main;
  # Linux x86-64 on other branches.
  packages:
    name: packages
    uses: ./.github/workflows/build.yml
    with:
      linux_only: ${{ !(github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    secrets: inherit

  # The phase 3 budgets on every OS: headless (layout, memory, journal,
  # keystroke and scrolling with each renderer's full frames) and, since
  # 2026-10-30, the bench in real windows (cold start, typing, scrolling,
  # the report view and memory; docs/specs/bench.md). Since
  # 2026-10-19 also the save budgets (docs/spec.md): the journal write per
  # edit under 1 ms, and for the synthetic 119-page script saved as
  # Fountain, as .fdx and as a project with tracked changes, a save's UI
  # thread time under 4 ms and the whole save under 50 ms. Numbers go to the
  # job summary and an artifact. Linux asserts the headless budgets that do
  # not depend on the renderer; everything else is reported. The UI thread's
  # save time is asserted on p95; since 2026-10-21 the whole save is
  # asserted on its median, and its p95 only reported, because the runner's
  # disk can stall one file sync for 100 ms or more (docs/spec.md).
  budgets:
    name: budgets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Every OS on pull requests and main; Linux on other branches.
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p coldopen-app --bins --example budgets
      - name: X server and libraries for the window (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libx11-xcb1
      - name: Headless budgets, CPU renderer
        env:
          COLDOPEN_PERF: "1"
        run: |
          assert=()
          if [ "$RUNNER_OS" = Linux ]; then assert=(--assert); fi
          target/release/examples/budgets --json budgets-tiny-skia.json "${assert[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Headless budgets, GPU renderer
        # Hosted runners may have no GPU; report when it works.
        continue-on-error: true
        run: target/release/examples/budgets --renderer wgpu --json budgets-wgpu.json | tee -a "$GITHUB_STEP_SUMMARY"
      # The bench a tester runs (docs/specs/bench.md), in full: every
      # budget, windowed ones included, and its report kept below. Linux
      # asserts the report view's scrolling from it (bench.md §5); the
      # rest is reported.
      - name: The bench
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          cmd=("target/release/coldopen-app$ext" --bench --out bench)
          if [ "$RUNNER_OS" = Linux ]; then cmd=(xvfb-run -a -s "-screen 0 1920x1080x24" "${cmd[@]}"); fi
          "${cmd[@]}" || [ $? -eq 1 ]
          { echo '```'; cat bench/*.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - name: The report view scrolls within its budget (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 - bench/*.json <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          b = next(b for b in r["budgets"] if b["id"] == "report_scrolling")
          print(b)
          sys.exit(0 if b.get("pass") else 1)
          EOF
      - name: Measure performance from the app's sheet (Linux)
        if: runner.os == 'Linux'
        env:
          COLDOPEN_BENCH_TEST: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo test --release --locked -p coldopen-app --test bench
      - name: Screenshots of the three themes
        env:
          # The same renderer on every OS, so the pictures compare.
          ICED_TEST_BACKEND: tiny-skia
        run: cargo run --release --locked -p coldopen-app --example screenshots -- screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budgets-${{ matrix.os }}
          path: |
            *.json
            bench
            screenshots/*.png
          if-no-files-found: ignore
