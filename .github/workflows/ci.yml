name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions minutes are limited (2026-10-15): pull requests and pushes to main
# run every OS; pushes to other branches run Linux only. A newer run on the
# same branch or pull request cancels the older one, except on main, where
# every commit keeps its result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Every `run` step uses bash, which GitHub starts as `bash -eo pipefail` on
# all three OSes (Git Bash on Windows), so any failing command fails the step,
# including one on the left of a pipe. Left to the defaults, Linux and macOS
# would run `bash -e`, which ignores that failure, and Windows would run pwsh,
# which only checks the exit code of a step's last command.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Every OS on pull requests and main; Linux on other branches.
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The layout and PDF goldens are compared byte for byte here, so the
      # same files passing on all three OSes is the cross-platform check.
      # --no-fail-fast runs every test binary even after one fails, so one
      # failure never hides another; the step still fails at the end.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Layout goldens and timing in a release build
        run: cargo test --release --locked -p coldopen-layout -- --nocapture
      - name: Tests left the tree clean
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::tests created or changed files in the repository"
            exit 1
          fi
      - name: Keep golden mismatches
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}
          path: target/tmp/golden
          if-no-files-found: ignore

  msrv:
    name: minimum Rust (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      # The same goldens must pass on the oldest supported compiler, which
      # shows they do not depend on the Rust version.
      - name: Test
        run: cargo test --workspace --locked

  perf:
    name: repagination budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Full repagination of a 120-page script under 50 ms
        env:
          COLDOPEN_PERF: "1"
        run: cargo test --release --locked -p coldopen-layout --test perf -- --nocapture

  refpdf:
    name: PDF goldens read back
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/refpdf
      - name: Lint and test the extractor
        working-directory: tools/refpdf
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Every PDF golden matches its page view
        run: |
          cargo build --release --locked --manifest-path tools/refpdf/Cargo.toml
          for pdf in tests/fixtures/layout/*.pdf; do
            tools/refpdf/target/release/refpdf self-check "$pdf" "${pdf%.pdf}.pages.txt"
          done
      - name: Every PDF golden is structurally valid
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          for pdf in tests/fixtures/layout/*.pdf; do qpdf --check "$pdf"; done

  license-boundary:
    name: license boundary
    runs-on: ubuntu-latest
    env:
      # The permissively licensed crates (CLAUDE.md, "Workspace layout").
      PERMISSIVE_CRATES: coldopen-screenplay coldopen-fountain coldopen-fonts coldopen-layout coldopen-fdx
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: MIT/Apache crates must not depend on GPL code
        run: |
          read -ra permissive <<<"$PERMISSIVE_CRATES"
          # Crates that declare only `license-file`, so cargo tree prints no
          # license for them, as `name@version`. Add one only after reading
          # its license file and finding it permissive. None so far.
          license_file_ok=()

          args=()
          for crate in "${permissive[@]}"; do args+=(-p "$crate"); done
          # `--target all` also follows dependencies gated on another OS.
          # cargo tree runs outside any pipe and its status is checked here,
          # so its failure fails the step even where `-e` does not apply.
          if ! tree=$(cargo tree --locked --target all "${args[@]}" -e normal,build --prefix none --format '{p}|{l}'); then
            echo "::error::cargo tree failed, so the dependency licenses were not checked."
            exit 1
          fi
          # Drop the blank lines between trees and the " (*)" cargo appends
          # to a crate it has already shown. Lines read "name vX.Y.Z ...|license".
          deps=$(sed -e '/^$/d' -e 's/ (\*)$//' <<<"$tree" | sort -u)
          echo "$deps"
          for crate in "${permissive[@]}"; do
            if ! grep -q "^$crate v" <<<"$deps"; then
              echo "::error::cargo tree did not list $crate."
              exit 1
            fi
          done

          if grep -E '^coldopen-(core|cli|app|mcp|link) ' <<<"$deps"; then
            echo "::error::A permissively licensed crate depends on a GPL crate."
            exit 1
          fi
          # Our own crates are checked too, so a new GPL crate of ours is
          # caught by its license even before it is named above.
          gpl=$(awk -F'|' 'NF && $2 ~ /GPL/' <<<"$deps")
          if [ -n "$gpl" ]; then
            echo "$gpl"
            echo "::error::A permissively licensed crate pulls in a GPL-family dependency."
            exit 1
          fi

          unlicensed=$(awk -F'|' 'NF && $2 == "" { split($1, p, " "); print p[1] "@" substr(p[2], 2) }' <<<"$deps")
          unvetted=()
          for crate in $unlicensed; do
            if [[ " ${license_file_ok[*]} " != *" $crate "* ]]; then unvetted+=("$crate"); fi
          done
          if [ ${#unvetted[@]} -gt 0 ]; then
            echo "::error::No SPDX license for ${unvetted[*]}. Read each license file; if it is permissive, add the crate to license_file_ok in this step."
            exit 1
          fi
      - name: MIT/Apache crates ship both license texts
        run: |
          read -ra permissive <<<"$PERMISSIVE_CRATES"
          for crate in "${permissive[@]}"; do
            # The files `cargo publish` would upload. The MIT license asks for
            # its notice in every copy.
            if ! files=$(cargo package --list --allow-dirty --locked -p "$crate"); then
              echo "::error::cargo package --list failed for $crate."
              exit 1
            fi
            for license in LICENSE-MIT LICENSE-APACHE; do
              if ! grep -qx "$license" <<<"$files"; then
                echo "::error::$crate would be published without $license."
                exit 1
              fi
              if ! cmp "crates/${crate#coldopen-}/$license" "$license"; then
                echo "::error::crates/${crate#coldopen-}/$license differs from the root $license."
                exit 1
              fi
            done
          done

  # Unsigned test builds of the app and the CLI for every OS, kept for 30
  # days on the run's page (Summary > Artifacts), with their sizes in the
  # job summary. Each archive carries TESTING.txt.
  app:
    name: app build (${{ matrix.name }})
    strategy:
      fail-fast: false
      # Every OS on pull requests and main; Linux on other branches.
      matrix: ${{ fromJSON((github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && '{"include":[{"name":"windows-x86_64","os":"windows-latest","target":"x86_64-pc-windows-msvc"},{"name":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"},{"name":"macos-x86_64","os":"macos-latest","target":"x86_64-apple-darwin"},{"name":"linux-x86_64","os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}]}' || '{"include":[{"name":"linux-x86_64","os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}]}') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build the app and the CLI
        run: cargo build --release --locked --target ${{ matrix.target }} -p coldopen-app -p coldopen-cli
      - name: Package
        run: bash .github/packaging/package.sh ${{ matrix.name }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cold-open-${{ matrix.name }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error
      - name: Size of an app with the CPU renderer only
        if: matrix.name == 'linux-x86_64'
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p coldopen-app --no-default-features
          bytes=$(wc -c <target/${{ matrix.target }}/release/coldopen-app | tr -d ' ')
          awk -v b="$bytes" 'BEGIN { printf "| App, CPU renderer only | %.2f MiB |\n", b / 1048576 }' >>"$GITHUB_STEP_SUMMARY"

  # The phase 3 budgets on every OS: headless (layout, memory, journal,
  # keystroke and scrolling with each renderer's full frames) and in a real
  # window (cold start, typing and scrolling frame to frame). Since
  # 2026-10-19 also the save budgets (docs/spec.md): the journal write per
  # edit under 1 ms, and for the synthetic 119-page script saved as
  # Fountain, as .fdx and as a project with tracked changes, a save's UI
  # thread time under 4 ms and the whole save under 50 ms. Numbers go to the
  # job summary and an artifact. Linux asserts the headless budgets that do
  # not depend on the renderer; everything else is reported. The UI thread's
  # save time is asserted on p95; since 2026-10-21 the whole save is
  # asserted on its median, and its p95 only reported, because the runner's
  # disk can stall one file sync for 100 ms or more (docs/spec.md).
  budgets:
    name: budgets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Every OS on pull requests and main; Linux on other branches.
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p coldopen-app --bins --example budgets
      - name: X server and libraries for the window (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libx11-xcb1
      - name: Headless budgets, CPU renderer
        env:
          COLDOPEN_PERF: "1"
        run: |
          assert=()
          if [ "$RUNNER_OS" = Linux ]; then assert=(--assert); fi
          target/release/examples/budgets --json budgets-tiny-skia.json "${assert[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Headless budgets, GPU renderer
        # Hosted runners may have no GPU; report when it works.
        continue-on-error: true
        run: target/release/examples/budgets --renderer wgpu --json budgets-wgpu.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Windowed app (cold start, typing, scrolling)
        continue-on-error: ${{ runner.os != 'Linux' }}
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          cmd=(python3 .github/packaging/measure.py "target/release/coldopen-app$ext" "target/release/examples/budgets$ext" window.json)
          if [ "$RUNNER_OS" = Windows ]; then cmd[0]=python; fi
          if [ "$RUNNER_OS" = Linux ]; then cmd=(xvfb-run -a -s "-screen 0 1920x1080x24" "${cmd[@]}"); fi
          "${cmd[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Screenshots of the three themes
        env:
          # The same renderer on every OS, so the pictures compare.
          ICED_TEST_BACKEND: tiny-skia
        run: cargo run --release --locked -p coldopen-app --example screenshots -- screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budgets-${{ matrix.os }}
          path: |
            *.json
            screenshots/*.png
          if-no-files-found: ignore
