name: Fuzz

# Not part of the phase gate: a weekly run of each cargo-fuzz target
# (Sundays). Weekly rather than nightly keeps a private repo inside its
# free Actions minutes; run it by hand from the Actions tab any time.
on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# As in ci.yml: `bash -eo pipefail`, so a failure anywhere in a pipe fails
# the step.
defaults:
  run:
    shell: bash

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fountain_roundtrip, envelope, journal_replay, fdx_read]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} for ten minutes
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600
      - name: Keep any crash input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts
