name: Fuzz

# Not part of the phase gate: ten minutes of each cargo-fuzz target. The
# weekly schedule is off until further notice (2026-10-15, Actions minutes
# ran out); run it by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

# As in ci.yml: `bash -eo pipefail`, so a failure anywhere in a pipe fails
# the step.
defaults:
  run:
    shell: bash

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fountain_roundtrip, envelope, journal_replay, fdx_read, link_line, app_config]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} for ten minutes
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600
      - name: Keep any crash input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts
