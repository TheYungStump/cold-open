name: Fuzz

# Not part of the phase gate. Every Monday, two minutes of each cargo-fuzz
# target (2026-10-16, review finding F17.5: the repository is public, so
# Actions minutes are free); by hand from the Actions tab, ten minutes each.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# As in ci.yml: `bash -eo pipefail`, so a failure anywhere in a pipe fails
# the step.
defaults:
  run:
    shell: bash

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fountain_roundtrip, envelope, journal_replay, fdx_read, link_line, app_config]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # `-timeout=2`: any input that takes over two seconds is reported as a
      # failure, so slow inputs are found, not only crashes (libFuzzer's own
      # limit is twenty minutes; review finding F15).
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ github.event_name == 'schedule' && 120 || 600 }} -timeout=2
      - name: Keep any crash input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts
