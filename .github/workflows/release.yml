name: Release

# A release (docs/specs/release.md §2): every package for every target,
# with SHA256SUMS.txt and the release notes.
# - A tag v<version> publishes it, marked a pre-release when the version
#   has a "-" (0.1.0-alpha.1). The tag must match Cargo.toml.
# - Run by hand (Actions > Release > Run workflow) on any branch, or by
#   pushing a branch named rehearsal/<anything>, it makes a private draft
#   named rehearsal-<run>, to check before tagging. GitHub runs a workflow
#   by hand only once it is on the default branch, so before the merge a
#   rehearsal is a push.
on:
  push:
    tags: ["v*"]
    branches: ["rehearsal/**"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    name: version matches the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version"
            exit 1
          fi
          if [ ! -f "docs/release-notes/v$version.md" ]; then
            echo "::error::no release notes: docs/release-notes/v$version.md"
            exit 1
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    # Only this job can write to the repository: it makes the release.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      # The symbols of every target's app, in one file (release.md §2, §9).
      - uses: actions/download-artifact@v5
        with:
          pattern: symbols-*
          path: symbols
          merge-multiple: true
      - name: Symbols
        run: |
          ls symbols
          (cd symbols && zip -qr "../dist/ColdOpen-$VERSION-symbols.zip" .)
      # The Linux builds' third-party license lists, for Flathub's build from
      # source, which can't run cargo-about offline (release.md §11.1).
      - uses: actions/download-artifact@v5
        with:
          name: third-party
          path: third-party
      - name: Third-party license lists (Linux)
        run: |
          cp third-party/x86_64-unknown-linux-gnu.txt "dist/ColdOpen-$VERSION-third-party-licenses-linux-x86_64.txt"
          cp third-party/aarch64-unknown-linux-gnu.txt "dist/ColdOpen-$VERSION-third-party-licenses-linux-aarch64.txt"
      # The MCP bundle (release.md §11.6): the CLI for each OS, for MCP
      # clients and the Official MCP Registry.
      - uses: actions/download-artifact@v5
        with:
          name: cli-macos-universal
          path: cli-macos
      - name: MCP bundle
        run: |
          mkdir -p mcpb-win mcpb-linux
          unzip -q -j "dist/ColdOpen-$VERSION-windows-x64.zip" "*coldopen.exe" -d mcpb-win
          dpkg-deb -x "dist/cold-open_${VERSION}_amd64.deb" mcpb-linux
          mac=$(find cli-macos -name coldopen -type f | head -1)
          python3 .github/packaging/mcpb/make_mcpb.py "$VERSION" mcpb-win/coldopen.exe "$mac"             mcpb-linux/usr/bin/coldopen "dist/ColdOpen-$VERSION-mcp.mcpb"
      - name: Checksums
        run: |
          cd dist
          ls -l
          sha256sum -- * | sort -k2 >SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes, with the files' sizes
        run: |
          cp "docs/release-notes/v$VERSION.md" notes.md
          {
            echo
            echo "## Files"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in dist/*; do
              [ "$(basename "$f")" = SHA256SUMS.txt ] && continue
              echo "| $(basename "$f") | $(awk -v b="$(wc -c <"$f")" 'BEGIN { printf "%.1f MB", b / 1000000 }') |"
            done
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS.txt --ignore-missing\` (Linux), \`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\` (macOS) or \`Get-FileHash\` (Windows)."
            echo
            echo "\`ColdOpen-$VERSION-symbols.zip\` isn't for installing: it lets the project read crash reports from this release. The \`third-party-licenses\` files list the licenses of the crates in the Linux builds, for building them from source. \`ColdOpen-$VERSION-mcp.mcpb\` is Cold Open's MCP server as a bundle, for AI clients that install MCP bundles."
            echo
            # SignPath's terms ask for the words on every release page
            # (release.md §8).
            echo "[Code signing policy](https://theyungstump.github.io/cold-open/code-signing.html) · [Privacy](https://theyungstump.github.io/cold-open/privacy.html)"
          } >>notes.md
      # The store files for this release, filled with its files' hashes
      # (release.md §11): Flathub, winget and the Homebrew cask, for the
      # project owner to submit.
      - name: Store files
        run: |
          python3 .github/packaging/stores.py "$VERSION" "$GITHUB_SHA" "$(date -u +%F)" dist stores
          pip install --quiet "aiohttp==3.10.10" "tomlkit==0.13.2"
          curl -fsSL -o flatpak-cargo-generator.py \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/9d86d336a39b9af38b86f114b6ce5820fe260f91/cargo/flatpak-cargo-generator.py"
          python3 flatpak-cargo-generator.py Cargo.lock -o stores/flathub/cargo-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: store-files
          path: stores
          if-no-files-found: error
      - name: Publish (tag) or draft (by hand)
        run: |
          args=(--title "Cold Open $VERSION" --notes-file notes.md)
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" "${args[@]}" dist/*
          else
            gh release create "rehearsal-$GITHUB_RUN_NUMBER" --draft --target "$GITHUB_SHA" \
              --title "Rehearsal: Cold Open $VERSION" --notes-file notes.md \
              $(case "$VERSION" in *-*) echo --prerelease ;; esac) dist/*
          fi

  # The Microsoft Store's package (release.md §11.4): an MSIX per Windows
  # architecture, joined in an .msixbundle, with the identity the owner's
  # Partner Center reservation gives, from repository variables. Kept as a
  # workflow artifact for the owner to upload; the Store signs it. Skipped
  # until MSIX_PUBLISHER is set.
  msix:
    needs: [version, build]
    if: vars.MSIX_PUBLISHER != ''
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: packages-windows-*
          path: dist
          merge-multiple: true
      - name: An MSIX per architecture, and the bundle
        run: ./.github/packaging/msix/store_bundle.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: store-msix
          path: store/*
          if-no-files-found: error

  # itch.io (release.md §11.5): each build pushed to its channel with butler,
  # itch.io's free uploader, for a published release only, and only when the
  # repository has the BUTLER_API_KEY secret and the ITCH_PROJECT variable
  # (the page's "user/game").
  itch:
    needs: [version, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_PROJECT: ${{ vars.ITCH_PROJECT }}
    steps:
      - name: Skipped without the key and the project
        if: env.BUTLER_API_KEY == '' || env.ITCH_PROJECT == ''
        run: echo "No BUTLER_API_KEY secret or ITCH_PROJECT variable; itch.io isn't updated."
      - uses: actions/download-artifact@v5
        if: env.BUTLER_API_KEY != '' && env.ITCH_PROJECT != ''
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: butler, pinned and checked
        if: env.BUTLER_API_KEY != '' && env.ITCH_PROJECT != ''
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/15.32.0/archive/default
          echo "2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5  butler.zip" | sha256sum -c -
          unzip -q butler.zip -d butler && chmod +x butler/butler
      - name: Push each build to its channel
        if: env.BUTLER_API_KEY != '' && env.ITCH_PROJECT != ''
        run: |
          push() { butler/butler push "dist/$1" "$ITCH_PROJECT:$2" --userversion "$VERSION"; }
          push "ColdOpen-$VERSION-windows-x64-setup.exe" windows-x64
          push "ColdOpen-$VERSION-windows-arm64-setup.exe" windows-arm64
          push "ColdOpen-$VERSION-macos-universal.dmg" mac-universal
          push "ColdOpen-$VERSION-x86_64.AppImage" linux-x64
          push "ColdOpen-$VERSION-aarch64.AppImage" linux-arm64
