# The Flatpak (docs/specs/release.md §3.6). It installs the release
# binaries that the .deb and the AppImage hold, from the folder package.sh
# stages beside this file as `files`. Flathub would need a build from
# source; that is for a later phase.
id: io.github.theyungstump.coldopen
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: coldopen-app
finish-args:
  # The window.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # The GPU renderer.
  - --device=dri
  # A script's crash journal and atomic save need its folder, not just the
  # file a portal hands over (the project owner's decision, 2026-10-30).
  - --filesystem=home
  # The agent link's run folder, so `coldopen mcp` outside can reach the
  # app inside (docs/specs/mcp.md §5).
  - --filesystem=xdg-run/coldopen:create
modules:
  - name: coldopen
    buildsystem: simple
    build-commands:
      - install -Dm755 coldopen-app /app/bin/coldopen-app
      - install -Dm755 coldopen /app/bin/coldopen
      - install -Dm644 io.github.theyungstump.coldopen.desktop /app/share/applications/io.github.theyungstump.coldopen.desktop
      - install -Dm644 io.github.theyungstump.coldopen.metainfo.xml /app/share/metainfo/io.github.theyungstump.coldopen.metainfo.xml
      - install -Dm644 io.github.theyungstump.coldopen.xml /app/share/mime/packages/io.github.theyungstump.coldopen.xml
      - for s in 16 24 32 48 64 128 256 512; do install -Dm644 icons/$s.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.theyungstump.coldopen.png; done
      - mkdir -p /app/share/licenses/io.github.theyungstump.coldopen && cp licenses/* /app/share/licenses/io.github.theyungstump.coldopen/
    sources:
      - type: dir
        path: files
