name: Something doesn't work
description: A bug in Cold Open, the command-line tool or the agent server.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Everything you write here is **public**.

        **Please don't attach a script you don't own,** or one you were sent: scripts are copyrighted. If the problem needs a script to show it, write a short scene of your own that does.

        **Report a problem…** in Cold Open's palette (or in About) opens this page with the version, OS and renderer already filled in. It never adds script text, file names or paths.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what Cold Open did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps, if you know them. "It happened once" is useful too.
      placeholder: |
        1. Open a new script
        2. Type a character name and press Enter
        3. …
  - type: input
    id: version
    attributes:
      label: Version
      description: About Cold Open shows it, and "Copy version info" copies it. Or run `coldopen --version`.
      placeholder: 0.1.0-alpha.2 (5d6e764a1b2c) (x86_64-pc-windows-msvc)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04…
    validations:
      required: true
  - type: input
    id: renderer
    attributes:
      label: Renderer
      description: CPU or GPU, as About Cold Open says.
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A short scene of your own that shows the problem, a screenshot, or a crash report. Take out anything private first.
  - type: checkboxes
    id: copyright
    attributes:
      label: Scripts
      options:
        - label: I haven't attached a script I don't own.
          required: true
